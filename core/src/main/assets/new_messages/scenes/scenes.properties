#v0.0.8 changes
scenes.epd_v0_x_changes.v0_0_8_comments=**- Released April 26, 2026**\n\n\
  I have reworked the base Samurai class, as well as the Auraslasher subclass. Changes are not set in stone and could change based on feedback.\n\n\
  In other news, I have revived Seedfinder! I reworked it entirely, based on Electrochecker's updated shpd-toolkit. It can handle seed searching, seed scouting, and daily run scouting.\n\n\
  _-- miaomix_
scenes.epd_v0_x_changes.v0_0_8_samurai_1=The Samurai base class has received a rework. The aim is to make the Sheath a little more meaningful than before. Also, tie the class more strongly with melee weapons, but keep ways to take advantage of missile weapons.\n\n\
  **Basic changes:**\n\n\
  **-** Buffed Sheathing accuracy increase to 1.5x.\n\
  **-** Nerfed Sheathing critical chance and accuracy increase to only melee weapons and Aura Slash.\n\
  **-** Fixed Sheathing not expiring when attack misses.\n\
  **-** Nerfed Worn Katana base crit rate to 20% (was 25%).\n\n\
  **-** Added hit and miss icons related to Samurai class and subclasses.\n\
  **-** New and updated icons for Samurai's T1 to T3 talents and related buffs.
scenes.epd_v0_x_changes.v0_0_8_samurai_2=**Tier 1 Talent changes:**\n\n\
  **-** Added new Prepared Meal talent in 1-1 slot, which allows _instant sheathing_ after eating.\n\
  **-** Buffed Basic Practice talent to _3%/5%_ and moved to 1-3 slot.\n\
  **-** Buffed Scabbard Block talent (1-4, was "Parrying") to grant _1-2/2-4 blocking_, but only while sheathed and when making a draw attack.\n\
  **-** Moved Drawing Enhancement talent to 1-5 slot, and removed Adrenaline Surge talent.
scenes.epd_v0_x_changes.v0_0_8_samurai_3=**Tier 2 Talent changes:**\n\n\
  **-** Nerfed talents Satiated Focus and Inscribed Focus talents (2-1 and 2-2) to only give _+50% crit chance_ (applies after sheathing increase), but both grant _1 more hit_ and are only consumed when a critical attack occurs.\n\
  **-** Changed Powerful Draw talent (2-3) when Metamorphed to gaining 5%/10% crit on a melee attack by waiting.\n\
  **-** Changed Dragon Eye talent (2-4) when Metamorphed to granting 3/4 tiles of Mind Vision by waiting.\n\
  **-** Buffed Weapon Mastery talent (2-5) to _+1%/+1.5% crit chance_ per excess point of Strength.\n\
  **-** Buffed Deadly Throw talent (2-6) to _15%/30%_ crit chance.
scenes.epd_v0_x_changes.v0_0_8_samurai_4=**Tier 3 Talent changes:**\n\n\
  **-** Buffed Lethal Focus talent (3-1, was "Quick Sheathing") to grant _instant sheathing_ within 5/10/15 turns after killing enemy.\n\
  **-** Nerfed Lethal Focus talent when Metamorphed to 2/4/6 turns of haste.\n\
  **-** Buffed Lethal Power talent (3-2) to _+10%/20%/30% crit damage_.
scenes.epd_v0_x_changes.v0_0_8_slasher_1=Auraslasher is the first Samurai subclass reworked. The other two will follow.\n\n\
  **Basic changes:**\n\n\
  **-** Nerfed Aura Slash to deal damage in the range of _1 to current energy_ (with normal distribution).\n\
  **-** Fixed Sword Energy charge rate being way too high (effectively a nerf).\n\
  **-** Buffed Sword Energy base charge rate to _40%_ of physical damage.\n\
  **-** Changed Aura Slash action tag to show total energy instead of a percentage.
scenes.epd_v0_x_changes.v0_0_8_slasher_2=**Talent changes:**\n\n\
  **-** Buffed Clear Mind talent (3-7) to increase Sword Energy charge rate to _60%/80%/100%_ of physical damage.\n\
  **-** Changed Arcane Aura talent (3-9) to apply _only the melee weapon's enchantment_ with 50%/100% chance, then with _+20% enchantment power_ at +3.\n\
  **-** Buffed Energy Siphoning talent (3-9) to recycle _20%/35%/50%_ of damage as energy.\n\
  **-** Replaced Energy Conservation talent (3-11) with Strategic Slash, which _cripples targets_ with Aura Slash when sheathed.\n\
  **-** Changed Wind Blast talent (3-12) to increase Aura Slash damage by _5/10/15_ when sheathed.
scenes.epd_v0_x_changes.v0_0_8_seedfinder=Seedfinder has been revived! Access it by pressing the _Seedfinder_ option in the run options pop-up during hero selection.\n\n\
  You can use Seedfinder to _search for a custom seed_ with certain items according to your input, _scout a custom seed_ for all items, or _scout today's Daily Run_. Note that the same seed and game version always generate the same dungeon!\n\n\
  _You must win at least one game before you are able to use the Seedfinder._
scenes.epd_v0_x_changes.v0_0_8_misc=**-** If you're not patient enough to unlock all classes and other functions not initially available, try _selecting a locked hero multiple times_.\n\
  **-** Changed base crit chances for Katanas and Sniper Rifle shots.\n\
  **-** Implemented jorexdeveloper's _android-eh_ per TrashboxBobylev's suggestion.\n\
  **-** Reordered badges: Moved Re-Arranged class unlocks next to Shattered class unlocks; moved Hedgehog badge to gold section.
scenes.epd_v0_x_changes.v0_0_8_bugfixes=Fixed the following bugs:\n\n\
  **-** Fixed Ignition spell having incorrect output quantity.\n\
  **-** Fixed bug where Medic's Gamma Ray Gun's cooldown state is not immediately updated in Quickslot.\n\
  **-** Fixed guns shooting self by aiming at an adjacent solid tile.\n\
  **-** Fixed bug where Cleric targeting spells can't auto-target.\n\
  **-** Fixed bug where cell labels aren't cleared in some cases.\n\
  **-** Fixed bug where Blueprint has enchantment name in some cases.