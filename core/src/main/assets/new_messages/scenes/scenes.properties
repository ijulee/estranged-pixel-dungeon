#v0.0.9
scenes.epd_v0_x_changes.v0_0_9_comments=**- Released June XX, 2026**\n\n\
  Development on Estranged PD has been slower as I am more busy now, but rest assured, I'm not abandoning it just yet! This update comes with an extensive rework of the Swordmaster subclass, plus some new functions for Seedfinder. Demonslayer rework will have to wait a bit, but I expect it to be a smaller rework like Auraslasher.\n\n\
  With Shattered PD v4.0 looming on the horizon, I may wait for it to come online before pushing the next update, since I expect a lot of work will be needed to merge new content into Estranged PD. Or I might rework Demonslayer first, if I get that done before the Shattered update release.\n\n\
  _-- miaomix_
scenes.epd_v0_x_changes.v0_0_9_swordmaster_1=The Samurai subclass Swordmaster has been reworked. Changes were made to balance overall power, by reducing the power ceiling on the two special draw attacks, while buffing the base stat bonuses from sheathing.\n\n\
  Visual Changes\n\n\
  **-** Quick Draw shows floating text when it triggers.\n\
  **-** New Swordmaster subclass icon as well as Dash Draw action icon and tag color.\n\
  **-** Updated and subclass talent icons to the new subclass icon, as well as their new respective effects.\n\
  **-** Updated Sheathing buff description for Swordmaster to reflect changes.\n\
  **-** Updated hit reason logic for Swordmaster to reflect changes.
scenes.epd_v0_x_changes.v0_0_9_swordmaster_2=Subclass Changes\n\n\
  **-** Dash Draw distance limited to 4 tiles, but can blink across walls and hazards.\n\
  **-** Dash Draw cooldown is now 80 turns, down from 100.\n\
  **-** Quick Draw now deals at 60% damage, down from 100%.\n\
  **-** Quick Draw no longer has infinite accuracy.\n\
  **-** Quick Draw cooldown is now 20 turns, down from 30.\n\
  **-** Increased sheathing accuracy bonus for Swordmaster to 2x, up from 1.5x for Samurai.\n\
  **-** Increased sheathing critical chance multiplier to 1.5x, up from 1.25x for Samurai.
scenes.epd_v0_x_changes.v0_0_9_swordmaster_3=New Talents\n\n\
  **-** Talent 3-7 _Drawing Technique_ grants bonuses on special draw attacks: +1 grants 5x accuracy, +2 grants 1.75x critical chance multiplier, and +3 grants 2 tiles of Greater Haste\n\
  **-** Talent 3-8 _Explosive Power_ increases special draw attack damage by +17%/+33%/+50%.\n\
  **-** Talent 3-9 _Flash Precision_ increases Quick Draw enchantment power by +50%/+100%/+150%.\n\
  **-** Talent 3-10 _Dash Acceleration_ increases Dash Draw distance to 6/8/10 tiles and grants 3 turns of Mind Vision at the same distance.\n\
  **-** Talent 3-11 _Scabbard Mastery_ allows Swordmaster to Sheath instantly once every 80/60/40 turns.\n\
  **-** Talent 3-12 _Focus Maintenance_ grants shielding equal to 10%/20%/30% damage done by special draw attacks.
scenes.epd_v0_x_changes.v0_0_9_seedfinder_1=**-** New _Exact Levels_ option allows you to search for items that exactly matches the prompt level (e.g. _frost +1_ will match _Wand of Frost +1_ but not _Wand of Frost +3_)\n\
  **-** New _Multi-range_ option allows you to specify a maximum search depth for each item, not exceeding the Max Depth option (e.g. _dirk, 4_ and _whip, 9_ will search for _Dirk_ up to 4F and _Whip_ up to 9F)\n\
  **-** Scrolls, potions, and rings are now captioned with their anonymous titles.\n\
  **-** Quest rewards are now properly identified and filtered.\n\
  **-** You can now search for multiple items of the same name (e.g. _Sickle_ and _Sickle +2_).
scenes.epd_v0_x_changes.v0_0_9_seedfinder_2=**-** Result window tab arrows now cycle through visible tabs before moving the visible tabs window.\n\
  **-** Result window now has _Retry_ button in search mode to find another matching seed.\n\
  **-** _Max Depth_ option now has _+/-_ buttons to adjust setting.\n\
  **-** Moved _Search Mode_ and _Search Room Type_ options into new _Search Options_ submenu, along with the new _Exact Levels_ and _Multi-range_ options.\n\
  **-** The depths where prompted items were found are now shown in the first page of the result window.
scenes.epd_v0_x_changes.v0_0_9_teleporter=**-** Teleporter now shows possible items list in Catalog categories.\n\
  **-** Teleporter and Catalog now creates usable keys for the current depth.\n\
  **-** Fixed bug where Descending/Ascending on a branch would lead to dead end floors.\n\
  **-** _Get Item_ function now warns of syntax and item creation errors, and allows editing the prompt.\n\
  **-** _Level Up_ function will still give a level at 30 and no longer IDs Potion of Experience.\n\
  **-** Added _GET_ button to Catalog item descriptions in debug mode to get the viewed item, rather than directly giving it to the player.
scenes.epd_v0_x_changes.v0_0_9_lab_shop=Changes have been made to Lab region shop item generation to make it more impactful:\n\n\
  **-** Second thrown weapon stack is always upgraded, may be enchanted, and is never cursed.\n\
  **-** The Plate Armor sold is upgraded, may be enchanted, and is never cursed.\n\
  **-** A random +1 Blueprint will be sold.
scenes.epd_v0_x_changes.v0_0_9_misc_1=**-** Attempted to eliminate Google Play Games integration for now.\n\
**-** Buffed Spear and Shield to have 1x attack delay even at range.\n\
**-** Buffed Auraslasher Arcane Aura talent (3-9) to proc the melee weapon's own effects as well.\n\
**-** Nerfed Superman Challenge to be less punishing. Heros start with 8 Max HP and gains 1 Max HP per level.\n\
**-** Nerfed katanas damage scaling to tier+1, down from tier+2.\n\
**-** Katanas no longer have the low minimum damage gimmick.\n\
**-** Pre-emptively renamed Eldritch enchantment (now _Eerie_) ahead of its return and functional change in Shattered v4.0.
scenes.epd_v0_x_changes.v0_0_9_misc_2=**-** Fixed capitalization when Demonslayer's Awakening turns on.\n\
**-** Hide Sword Energy buff icon when out of energy.\n\
**-** Changed phrasing on class unlock hints.\n\
**-** Removed Sword of Death from Misc. Equipment category.\n\
**-** Adjusted Samurai Prepared Meal talent (1-1) buff color.\n\
**-** Changed Demonslayer descriptions.\n\
**-** Made sure unique weapons (and Pickaxe before quest completion) can't be scrapped by Gunner or Archer.\n\
**-** Unique weapons (and Pickaxe before quest completion) can no longer be transformed by Blueprints.
scenes.epd_v0_x_changes.v0_0_9_misc_3=**-** Buffed Medic's Potion Recycling talent (2-2) to apply on exotic potions (except Mastery).\n\
**-** Added icon, name, and description for Instant Sheathing buff from Samurai Lethal Focus talent (3-1).\n\
**-** Blueprints can now be bought and sold in shops (roughly 1.5x price of weapon).
scenes.epd_v0_x_changes.v0_0_9_bugfixes_1=**-** Fixed True Runic Blade enchantment boost not applying to Projecting enchantment.\n\
**-** Fixed crash when shooting Tengu with a bow triggers the phase transition.\n\
**-** Fixed issue with Necklace ring not applying after reload.\n\
**-** Fixed bug where critical hits don't take weapon augment into account.\n\
**-** Fixed bug when Samurai sheathing with Dragon's Eye talent (2-4) did not update action tags.\n\
**-** Fixed Pill of Vitamin price and energy value.
scenes.epd_v0_x_changes.v0_0_9_bugfixes_2=**-** Fixed bug where Enchanter's Spell Burst refunds 2 charges and would not refund if Tome charge was full.\n\
**-** Fixed bug where Duelist's Hero Sword would cause crash if it or the base weapon did not have an enchantment.\n\
**-** Fixed poor logic with Projecting missile weapons causing them to be stuck in walls.\n\
**-** Fixed Seedfinder crashes in some cases.\n\
**-** Fixed Medic's Potion Recycling talent (2-2) unnecessarily picking up 0 pills. \n\
**-** Fixed bug where Sword of Death cannot be enchanted.
scenes.epd_v0_x_changes.v0_0_9_bugfixes_3=**-** Fixed Gunslinger not instantly attacking with thrown weapons after movement.\n\
**-** Fixed Medic's Scar Attack talent (1-1) incorrectly counting all buffs, and using the same roll for each debuff.\n\
**-** Fixed Swordmaster's Quick Draw not working after missing a Dash Draw.\n\
**-** Fixed Swordmaster's Dash Draw not properly removing targeting crosses.
