scenes.seedfindscene.info_title=Seedfinder Info
scenes.seedfindscene.info_body=Seedfinder has 3 modes:\n\n\
  _1. Find Seed:_\n\
  Search for a custom seed matching input item names. Each entry must be on its own line, and can have an upgrade number "+N". Partial and lowercase names are allowed (e.g. _"sharpshooting +1"_ will match _Ring of Sharpshooting +1_). Matching items will be _highlighted_.\n\n\
  _2. Scout Seed:_\n\
  Scout a custom seed for all items. The following are highlighted: _Scroll of Upgrade_, _Potion of Strength_, _Entrance/Exit_ rooms.\n\n\
  _3. Scout Daily Run_:\n\
  Scout today's Daily Run.\n\n\
  Note that the same seed will always generate the same dungeon in the same game version!\n\
  Search options, such as maximum depth and item types, can be found in _Seedfinder Settings_. Room types on all non-boss floors are also listed, and can be searched with an option.

